# swiglu — standard SwiGLU FFN, full budget. The phase-2 baseline to beat.
run_name: swiglu_shakespeare
ffn: swiglu

# --- backbone (identical across all variants) ---
d_model: 192
n_layer: 4
n_head: 6
context: 128
ffn_mult: 4
dropout: 0.1

# --- dendritic / augmentative knobs (unused by plain swiglu) ---
branches: 4
main_frac: 0.5
connectivity: sparse

# --- data ---
dataset: tinyshakespeare

# --- optimisation ---
seed: 0
batch_size: 64
lr: 0.0006
weight_decay: 0.1
grad_clip: 1.0
warmup_steps: 200
max_steps: 2500
eval_interval: 250
eval_iters: 100
sample_tokens: 300
