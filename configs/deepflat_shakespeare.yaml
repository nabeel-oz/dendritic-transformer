# deep_flat — depth- and parameter-matched flat control: d -> w -> w -> d, dense,
# no compartments. Same 3 weight layers / 2 nonlinearities as the dendritic
# variants. 'deep_flat vs V0' isolates depth; 'V2 vs deep_flat' isolates
# compartmentalization. Parameter-matched to V0 (allocated == V0).
run_name: deepflat_shakespeare
ffn: deep_flat

d_model: 192
n_layer: 4
n_head: 6
context: 128
ffn_mult: 4
dropout: 0.1
branches: 4

dataset: tinyshakespeare

seed: 0
batch_size: 64
lr: 0.0006
weight_decay: 0.1
grad_clip: 1.0
warmup_steps: 200
max_steps: 2500
eval_interval: 250
eval_iters: 100
sample_tokens: 300
