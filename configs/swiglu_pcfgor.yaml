# SwiGLU baseline on the OR-like PCFG (round 3 non-XOR control).
run_name: swiglu_pcfgor
ffn: swiglu

d_model: 192
n_layer: 4
n_head: 6
context: 128
ffn_mult: 4
dropout: 0.1

branches: 4
main_frac: 0.5
connectivity: sparse

dataset: toy_pcfg_or

seed: 0
batch_size: 64
lr: 0.0006
weight_decay: 0.1
grad_clip: 1.0
warmup_steps: 200
max_steps: 2500
eval_interval: 250
eval_iters: 100
sample_tokens: 200
