# V2 — Dendritic FREE wiring (the control): branches + soma, every branch reads
# ALL inputs. Same backbone as V0; parameter-matched to V0 (allocated == V0).
run_name: v2free_shakespeare
ffn: dendritic_free

d_model: 192
n_layer: 4
n_head: 6
context: 128
ffn_mult: 4
dropout: 0.1
branches: 4

dataset: tinyshakespeare

seed: 0
batch_size: 64
lr: 0.0006
weight_decay: 0.1
grad_clip: 1.0
warmup_steps: 200
max_steps: 2500
eval_interval: 250
eval_iters: 100
sample_tokens: 300
