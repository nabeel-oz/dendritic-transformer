<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="af-a" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#1C2A47"/>
    </marker>
    <marker id="af-b" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#1C2A47" fill-opacity="0.45"/>
    </marker>
  </defs>
  <rect width="1040" height="440" fill="#E9ECE7"/>

  <text x="520" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1C2A47">ArborFFN &#8212; the dendritic add-on, unpacked</text>

  <!-- input x -->
  <circle cx="60" cy="215" r="15" fill="#1C2A47"/>
  <text x="60" y="220" text-anchor="middle" font-size="12.5" fill="#F4F6F2">x</text>

  <!-- route stack, implying B branches -->
  <rect x="160" y="150" width="168" height="90" rx="10" fill="#2C7F8C" fill-opacity="0.28"/>
  <rect x="150" y="160" width="168" height="90" rx="10" fill="#2C7F8C" fill-opacity="0.55"/>
  <rect x="140" y="170" width="168" height="90" rx="10" fill="#2C7F8C"/>
  <text x="224" y="146" text-anchor="middle" font-size="10" fill="#1C2A47" fill-opacity="0.6">(&#215; B branches, stacked)</text>
  <text x="224" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#F4F6F2">route R&#8271;</text>
  <text x="224" y="221" text-anchor="middle" font-size="11" fill="#F4F6F2" fill-opacity="0.9">learned cluster of x</text>
  <text x="224" y="238" text-anchor="middle" font-size="9.5" fill="#F4F6F2" fill-opacity="0.8">sparsemax &#8594; pruned local</text>

  <line x1="75" y1="215" x2="140" y2="215" stroke="#1C2A47" stroke-opacity="0.55" stroke-width="1.7" marker-end="url(#af-a)"/>

  <!-- Wa / Wb projections -->
  <rect x="380" y="110" width="86" height="46" rx="9" fill="#2C7F8C"/>
  <text x="423" y="138" text-anchor="middle" font-size="13" fill="#F4F6F2">Wa</text>
  <rect x="380" y="284" width="86" height="46" rx="9" fill="#2C7F8C"/>
  <text x="423" y="312" text-anchor="middle" font-size="13" fill="#F4F6F2">Wb</text>

  <g stroke="#1C2A47" stroke-opacity="0.55" stroke-width="1.7" fill="none" marker-end="url(#af-a)">
    <line x1="308" y1="200" x2="380" y2="140"/>
    <line x1="308" y1="230" x2="380" y2="300"/>
  </g>

  <!-- multiply node: coincidence -->
  <circle cx="520" cy="215" r="19" fill="none" stroke="#1C2A47" stroke-width="2"/>
  <text x="520" y="221" text-anchor="middle" font-size="16" fill="#1C2A47">&#215;</text>

  <g stroke="#1C2A47" stroke-opacity="0.55" stroke-width="1.7" fill="none" marker-end="url(#af-a)">
    <line x1="466" y1="140" x2="506" y2="204"/>
    <line x1="466" y1="300" x2="506" y2="226"/>
  </g>

  <text x="520" y="255" text-anchor="middle" font-size="10.5" fill="#1C2A47" fill-opacity="0.75">z&#8271; = coincidence, not sum</text>

  <!-- combine (linear over concatenated branches) -->
  <rect x="580" y="170" width="188" height="90" rx="10" fill="#2C7F8C"/>
  <text x="674" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#F4F6F2">combine</text>
  <text x="674" y="226" text-anchor="middle" font-size="11" fill="#F4F6F2" fill-opacity="0.9">concat B branches &#8594; linear</text>

  <line x1="539" y1="215" x2="580" y2="215" stroke="#1C2A47" stroke-opacity="0.55" stroke-width="1.7" marker-end="url(#af-a)"/>

  <!-- sum with x (residual, small scale) -->
  <circle cx="822" cy="215" r="18" fill="none" stroke="#1C2A47" stroke-width="2"/>
  <line x1="822" y1="206" x2="822" y2="224" stroke="#1C2A47" stroke-width="2"/>
  <line x1="813" y1="215" x2="831" y2="215" stroke="#1C2A47" stroke-width="2"/>
  <line x1="768" y1="215" x2="805" y2="215" stroke="#1C2A47" stroke-opacity="0.55" stroke-width="1.7" marker-end="url(#af-a)"/>
  <text x="795" y="196" text-anchor="middle" font-size="11" fill="#1C2A47" fill-opacity="0.7">&#215; small</text>

  <!-- main (SwiGLU soma) -->
  <rect x="862" y="191" width="150" height="48" rx="10" fill="#6E63A6"/>
  <text x="937" y="220" text-anchor="middle" font-size="13" fill="#F4F6F2">main (SwiGLU)</text>
  <line x1="840" y1="215" x2="862" y2="215" stroke="#1C2A47" stroke-opacity="0.55" stroke-width="1.7" marker-end="url(#af-a)"/>
  <line x1="1012" y1="215" x2="1032" y2="215" stroke="#1C2A47" stroke-opacity="0.55" stroke-width="1.7" marker-end="url(#af-a)"/>

  <!-- bypass x -> sum: the residual path -->
  <path d="M60,230 C60,370 822,370 822,233" fill="none" stroke="#1C2A47" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#af-b)"/>

  <text x="520" y="404" text-anchor="middle" font-size="12.5" fill="#1C2A47" fill-opacity="0.7">x is preserved (residual, dashed) &#8212; the soma still sees the raw input, only enriched</text>
  <text x="520" y="426" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1C2A47">Each branch learns its own local cluster, then multiplies two projections to detect coincidence &#8212; before the soma fires.</text>
</svg>
